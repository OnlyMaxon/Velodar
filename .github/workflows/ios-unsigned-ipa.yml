name: Build unsigned iOS IPA

# Builds an UNSIGNED .ipa for sideloading (Sideloadly / AltStore will apply the
# signature on your machine). No Apple Developer account or certificates needed
# in CI. Trigger manually from the Actions tab.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # Inlined into the JS bundle at build time. Set these as repository
      # secrets: Settings -> Secrets and variables -> Actions.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_ORS_API_KEY: ${{ secrets.EXPO_PUBLIC_ORS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild iOS native project
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned .app (Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Velodar.xcworkspace \
            -scheme Velodar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package into unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Velodar.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built .app not found at $APP_PATH"
            find build/Build/Products -maxdepth 2 -name "*.app" -print || true
            exit 1
          fi
          rm -rf Payload Velodar-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Velodar-unsigned.ipa Payload
          echo "Created Velodar-unsigned.ipa ($(du -h Velodar-unsigned.ipa | cut -f1))"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velodar-unsigned-ipa
          path: Velodar-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
